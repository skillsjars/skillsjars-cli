name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UPX_VERSION: "5.3.0"

# Two stages, because the Kotlin/Native compiler does not run on Linux arm64: `build` compiles each target on a
# host that can (linuxArm64 is cross-compiled on x64), and `verify` runs the tests and the binary on the target's
# own OS and architecture.
jobs:
  build:
    name: build ${{ matrix.target }} (${{ matrix.engine }}, ${{ matrix.cli }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: linuxX64,   engine: native, cli: clikt-core }
          - { os: ubuntu-22.04, target: linuxArm64, engine: native, cli: clikt-core }
          - { os: macos-15,     target: macosArm64, engine: native, cli: clikt-core }
          - { os: windows-2025, target: mingwX64,   engine: native, cli: clikt-core }
          # Spike variants, for size comparison (SPEC.md "Spike 1"). On Linux, `native` is curl.
          - { os: macos-15,     target: macosArm64, engine: curl,   cli: clikt-core }
          - { os: windows-2025, target: mingwX64,   engine: curl,   cli: clikt-core }
          - { os: ubuntu-22.04, target: linuxX64,   engine: native, cli: clikt }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build.gradle.kts') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      - name: Build test and release binaries
        run: |
          ./gradlew -Psjm.engine=${{ matrix.engine }} -Psjm.cli=${{ matrix.cli }} \
            linkDebugTest${{ matrix.target }} linkReleaseExecutable${{ matrix.target }} fixture-skill-jar fixture-empty-jar

      - name: Collect
        run: |
          mkdir -p out
          ext=$([ "$RUNNER_OS" = Windows ] && echo .exe || echo .kexe)
          suffix=$([ "$RUNNER_OS" = Windows ] && echo .exe || true)
          cp "build/bin/${{ matrix.target }}/debugTest/test$ext" "out/test$suffix"
          cp "build/bin/${{ matrix.target }}/releaseExecutable/sjm$ext" "out/sjm-${{ matrix.target }}-${{ matrix.engine }}-${{ matrix.cli }}$suffix"
          cp -r build/fixtures out/fixtures

      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.target }}-${{ matrix.engine }}-${{ matrix.cli }}
          path: out
          if-no-files-found: error

  verify:
    name: verify ${{ matrix.target }} (${{ matrix.engine }}, ${{ matrix.cli }})
    needs: build
    # Verify every target that built, even when another target's build failed.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04,     target: linuxX64,   upx: amd64_linux, engine: native, cli: clikt-core, containers: "ubuntu:22.04 debian:stable-slim fedora:latest archlinux:latest" }
          - { os: ubuntu-22.04-arm, target: linuxArm64, upx: arm64_linux, engine: native, cli: clikt-core, containers: "ubuntu:22.04 debian:stable-slim fedora:latest" }
          - { os: macos-15,         target: macosArm64, upx: "",          engine: native, cli: clikt-core, containers: "" }
          - { os: windows-2025,     target: mingwX64,   upx: win64,       engine: native, cli: clikt-core, containers: "" }
          - { os: macos-15,         target: macosArm64, upx: "",          engine: curl,   cli: clikt-core, containers: "" }
          - { os: windows-2025,     target: mingwX64,   upx: win64,       engine: curl,   cli: clikt-core, containers: "" }
          - { os: ubuntu-22.04,     target: linuxX64,   upx: amd64_linux, engine: native, cli: clikt,      containers: "" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: build-${{ matrix.target }}-${{ matrix.engine }}-${{ matrix.cli }}
          path: out

      - name: Test
        run: |
          chmod +x out/test* out/sjm-* 2>/dev/null || true
          echo "BINARY=$(ls out/sjm-*)" >> "$GITHUB_ENV"
          SJM_TEST_FIXTURES="$PWD/out/fixtures" ./out/test$([ "$RUNNER_OS" = Windows ] && echo .exe || true)

      - name: Strip
        if: runner.os != 'Windows'
        run: strip "$BINARY"

      # Not `UPX`: upx reads that variable as default options.
      - name: Install UPX
        if: matrix.upx != ''
        run: |
          name=upx-$UPX_VERSION-${{ matrix.upx }}
          if [ "$RUNNER_OS" = Windows ]; then
            curl -fsSL -o upx.zip "https://github.com/upx/upx/releases/download/v$UPX_VERSION/$name.zip"
            unzip -q upx.zip && echo "UPX_BIN=$PWD/$name/upx.exe" >> "$GITHUB_ENV"
          else
            curl -fsSL "https://github.com/upx/upx/releases/download/v$UPX_VERSION/$name.tar.xz" | tar -xJ
            echo "UPX_BIN=$PWD/$name/upx" >> "$GITHUB_ENV"
          fi

      - name: Smoke test, dependencies, size, startup
        run: |
          python=$(command -v python3 || command -v python)
          "$python" .github/scripts/smoke.py "$BINARY" "${{ matrix.target }} (${{ matrix.engine }}, ${{ matrix.cli }})" ${UPX_BIN:+--upx "$UPX_BIN"}

      - name: Clean containers
        if: matrix.containers != ''
        run: .github/scripts/containers.sh "$BINARY" ${{ matrix.containers }}

      - uses: actions/upload-artifact@v7
        with:
          name: sjm-${{ matrix.target }}-${{ matrix.engine }}-${{ matrix.cli }}
          path: out/sjm-*
          if-no-files-found: error
